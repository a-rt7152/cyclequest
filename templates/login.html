{% extends "base.html" %}
{% block title %}Log in — Cycle Quest{% endblock %}
{% block content %}
<div class="form-page">
  <h1>Log in</h1>
  <form method="POST">
    <div class="field">
      <label for="username">Username or email</label>
      <input type="text" id="username" name="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-block">Log in</button>
  </form>
  <p class="form-footnote">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
</div>
{% endblock %}
