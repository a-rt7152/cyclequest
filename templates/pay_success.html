{% extends "base.html" %}
{% block title %}Booking confirmed — Cycle Quest{% endblock %}
{% block content %}
<div class="form-page">
  <h1>You're all set!</h1>
  <p style="text-align:center;">Your <strong>{{ booking.cycle.name }}</strong> is booked for
    {{ booking.hours }} hour{{ 's' if booking.hours > 1 else '' }}.</p>
  <div class="hero-actions" style="justify-content:center;margin-top:20px;">
    <a href="{{ url_for('track', cycle_id=booking.cycle_id) }}" class="btn">Track it live</a>
    <a href="{{ url_for('bookings') }}" class="btn secondary">My bookings</a>
  </div>
</div>
{% endblock %}
